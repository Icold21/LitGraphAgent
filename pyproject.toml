[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litgraph-agent"
version = "1.0.0"
description = "Autonomous Literature Research Agent with Obsidian Knowledge Graph Synthesis"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["obsidian", "literature-review", "knowledge-graph", "ai-agent", "arxiv", "zettelkasten"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "arxiv>=2.1.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "urllib3>=2.2.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
litgraph = "main:main"

[tool.setuptools.packages.find]
include = ["lit_graph*"]
exclude = ["vaults*", "tests*"]

[tool.setuptools]
py-modules = ["main"]